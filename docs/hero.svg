<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">playbooks: the unlock lifecycle for mr-robot</title>
  <desc id="d">An engagement starts with seed tasks; a posted finding matches a rule, which spawns new tasks on the board; when a task's dependencies are satisfied it becomes ready. The whole HackTheBox methodology is tuned by editing YAML, not code.</desc>
  <defs><linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#e01e5a"/><stop offset=".5" stop-color="#ff5470"/><stop offset="1" stop-color="#ff9b3d"/></linearGradient></defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#f0eef2; }
    .muted { fill:#9a94a6; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes travel { 0% { offset-distance:0%; opacity:0 } 10%{opacity:1} 90%{opacity:1} 100% { offset-distance:100%; opacity:0 } } .travel { animation: travel 2.6s linear infinite; offset-path: path('M300 318 L 560 318'); }
    @keyframes l0 { 0%,2.00% { opacity:0 } 6.00%,23.00% { opacity:1 } 26.00%,100% { opacity:0 } } .l0 { animation:l0 10.0s infinite; }
    @keyframes l1 { 0%,22.00% { opacity:0 } 26.00%,43.00% { opacity:1 } 46.00%,100% { opacity:0 } } .l1 { animation:l1 10.0s infinite; }
    @keyframes l2 { 0%,42.00% { opacity:0 } 46.00%,63.00% { opacity:1 } 66.00%,100% { opacity:0 } } .l2 { animation:l2 10.0s infinite; }
    @keyframes l3 { 0%,62.00% { opacity:0 } 66.00%,83.00% { opacity:1 } 86.00%,100% { opacity:0 } } .l3 { animation:l3 10.0s infinite; }
    @keyframes l4 { 0%,82.00% { opacity:0 } 86.00%,103.00% { opacity:1 } 106.00%,100% { opacity:0 } } .l4 { animation:l4 10.0s infinite; }
    @keyframes t0 { 0%,3.00% { opacity:0; transform:translateX(-6px) } 8.00%,100% { opacity:1; transform:translateX(0) } } .t0 { animation:t0 10.0s infinite; }
    @keyframes t1 { 0%,25.00% { opacity:0; transform:translateX(-6px) } 30.00%,100% { opacity:1; transform:translateX(0) } } .t1 { animation:t1 10.0s infinite; }
    @keyframes t2 { 0%,45.00% { opacity:0; transform:translateX(-6px) } 50.00%,100% { opacity:1; transform:translateX(0) } } .t2 { animation:t2 10.0s infinite; }
    @keyframes t3 { 0%,65.00% { opacity:0; transform:translateX(-6px) } 70.00%,100% { opacity:1; transform:translateX(0) } } .t3 { animation:t3 10.0s infinite; }
    @keyframes t4 { 0%,80.00% { opacity:0; transform:translateX(-6px) } 85.00%,100% { opacity:1; transform:translateX(0) } } .t4 { animation:t4 10.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; opacity:1 !important; transform:none !important; } }
  </style>
  <rect width="960" height="400" rx="20" fill="#120e14"/>
  <text x="40" y="54" font-size="30" font-weight="800" style="fill:url(#title)">playbooks</text>
  <text x="42" y="82" font-size="15" class="muted">Declarative YAML that drives <tspan style="fill:#ff8a9c">mr-robot</tspan> — tune the methodology by editing files, not code.</text>

  <!-- lifecycle row -->
  <text x="40" y="120" font-size="11" font-weight="700" class="muted">UNLOCK LIFECYCLE</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <g class="l0"><rect x="40" y="132" width="120" height="40" rx="9" fill="#241018" stroke="#e01e5a"/><text x="100" y="157">seed task</text></g>
    <g class="l1"><rect x="190" y="132" width="140" height="40" rx="9" fill="#241018" stroke="#ff5470"/><text x="260" y="157">finding posted</text></g>
    <g class="l2"><rect x="360" y="132" width="120" height="40" rx="9" fill="#2a1410" stroke="#ff7a4d"/><text x="420" y="157">rule fires</text></g>
    <g class="l3"><rect x="510" y="132" width="140" height="40" rx="9" fill="#2a1d10" stroke="#ff9b3d"/><text x="580" y="157">task spawned</text></g>
    <g class="l4"><rect x="680" y="132" width="150" height="40" rx="9" fill="#13241a" stroke="#43c777"/><text x="755" y="157" style="fill:#8fe6a6">deps met → ready</text></g>
  </g>
  <g fill="#6b6575" font-size="14">
    <text x="172" y="158">→</text><text x="342" y="158">→</text><text x="492" y="158">→</text><text x="662" y="158">→</text>
  </g>

  <!-- left: a rule in YAML -->
  <rect x="40" y="196" width="260" height="168" rx="12" fill="#0f1620" stroke="#28303f"/>
  <text x="58" y="220" font-size="10.5" font-weight="700" style="fill:#ff9f7a">htb-default.yaml</text>
  <text x="58" y="244" font-size="11" class="mono muted">- id: web-service-to-enum</text>
  <text x="58" y="263" font-size="11" class="mono muted">  when: { type: service,</text>
  <text x="58" y="281" font-size="11" class="mono muted">    match: { service: http } }</text>
  <text x="58" y="299" font-size="11" class="mono muted">  spawn:</text>
  <text x="58" y="317" font-size="11" class="mono" style="fill:#9fd6ff">  - task: enum.web.content</text>
  <text x="58" y="335" font-size="11" class="mono muted">    priority: 75</text>
  <text x="58" y="353" font-size="11" class="mono muted">    hat: white-hat</text>

  <!-- finding chip travels to the board -->
  <g class="travel"><rect x="-70" y="-13" width="140" height="26" rx="13" fill="#2a1518" stroke="#ff5470"/><text x="0" y="5" text-anchor="middle" font-size="11" class="mono" style="fill:#ff9eae">service: http :80</text></g>

  <!-- right: the board filling up -->
  <rect x="580" y="196" width="340" height="168" rx="12" fill="#14101a" stroke="#28222f"/>
  <text x="598" y="220" font-size="10.5" font-weight="700" class="muted">THE BOARD</text>
  <g font-size="11">
    <g class="t0"><rect x="598" y="230" width="304" height="24" rx="6" fill="#13241a"/><text x="610" y="246" style="fill:#8fe6a6">✓ recon.portscan · done</text></g>
    <g class="t1"><rect x="598" y="258" width="304" height="24" rx="6" fill="#1c2636"/><text x="610" y="274" style="fill:#9fd6ff">▸ enum.web.content · ready</text></g>
    <g class="t2"><rect x="598" y="286" width="304" height="24" rx="6" fill="#1c2636"/><text x="610" y="302" style="fill:#9fd6ff">▸ enum.web.vulns · ready</text></g>
    <g class="t3"><rect x="598" y="314" width="304" height="24" rx="6" fill="#211c2b"/><text x="610" y="330" class="muted">◷ foothold.exploit · blocked</text></g>
    <g class="t4"><rect x="598" y="342" width="304" height="16" rx="5" fill="#1a1622"/><text x="610" y="354" class="muted" font-size="10">…spawned by matching rules as findings arrive</text></g>
  </g>
</svg>
